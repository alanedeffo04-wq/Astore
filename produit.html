<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produit – ASTORE</title>
  <meta name="description" content="Détail du produit ASTORE.">
  <link rel="icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="produit" data-wait-data>

<div id="site-header"></div>

<main class="wrap page">

  <nav class="crumbs" aria-label="Fil d’Ariane">
    <a href="index.html">Accueil</a>
    <a href="catalogue.html">Catalogue</a>
    <span id="crumb-name" aria-current="page"></span>
  </nav>

  <p class="state" id="p-loading">Chargement du produit…</p>
  <div class="state" id="p-missing" hidden>
    <h1>Produit introuvable</h1>
    <p>Ce produit n’existe pas ou n’est plus disponible.</p>
    <a class="btn btn-primary" href="catalogue.html">Retour au catalogue</a>
  </div>

  <div class="product" id="product" hidden>

    <div class="gallery">
      <div class="gallery-main"><img id="gallery-main" src="" alt=""></div>
      <ul class="gallery-thumbs" id="gallery-thumbs"></ul>
    </div>

    <div class="product-info">
      <p class="eyebrow" id="p-category"></p>
      <h1 id="p-name"></h1>
      <p class="muted" id="p-brand"></p>

      <p class="product-price" id="p-price"></p>
      <p class="pcard-stock" id="p-stock"></p>

      <p class="product-desc" id="p-desc"></p>

      <div class="buy">
        <div class="qty">
          <button type="button" id="qty-minus" aria-label="Diminuer la quantité">−</button>
          <input type="number" id="qty" value="1" min="1" inputmode="numeric" aria-label="Quantité souhaitée">
          <button type="button" id="qty-plus" aria-label="Augmenter la quantité">+</button>
        </div>
        <button class="btn btn-primary btn-lg" type="button" id="p-add">Ajouter au panier</button>
      </div>
      <p class="muted small" id="p-available"></p>

      <a class="btn btn-wa btn-block" id="p-wa" href="#">Poser une question sur WhatsApp</a>

      <section class="specs-block" id="p-specs-block" hidden>
        <h2>Caractéristiques</h2>
        <dl class="specs" id="p-specs"></dl>
      </section>
      <p class="warranty" id="p-warranty" hidden></p>
    </div>
  </div>

  <section class="section-sm" id="similar" hidden>
    <div class="section-head"><h2>Produits similaires</h2></div>
    <div class="product-grid" id="similar-grid"></div>
  </section>

</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="images.js"></script>
<script src="script.js"></script>
<script src="produit.js"></script>
</body>
</html>
